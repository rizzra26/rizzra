version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:16.10
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: Install dependencies
          command: |
            ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" $VPS_USER@$VPS_HOST "export PATH=~/.nvm/versions/node/v22.19.0/bin:$PATH; cd ~/apps/rizzra; git pull; pnpm install"
      - run:
          name: Build Nuxt app
          command: |
            ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" $VPS_USER@$VPS_HOST "export PATH=~/.nvm/versions/node/v22.19.0/bin:$PATH; cd ~/apps/rizzra; rm -rf .next/ .output/; pnpm run build"
      - run:
          name: Build Docker image
          command: |
            ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" $VPS_USER@$VPS_HOST "docker stop rizzra; docker container prune -f; docker image prune -a -f; cd ~/apps/rizzra; docker build --no-cache -t rizzra ."

  deploy:
    docker:
      - image: cimg/node:16.10
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: Login to Docker Hub
          command: |
            ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" $VPS_USER@$VPS_HOST "docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD"
      - run:
          name: Push Docker image to Docker Hub
          command: |
            ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" $VPS_USER@$VPS_HOST "docker tag rizzra $DOCKER_USERNAME/rizzra:latest; docker push $DOCKER_USERNAME/rizzra:latest"
      - run:
          name: Deploy to VPS
          command: |
            ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" $VPS_USER@$VPS_HOST "docker pull $DOCKER_USERNAME/rizzra:latest; docker run -d -p 3030:3030 --name rizzra $DOCKER_USERNAME/rizzra:latest"

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
